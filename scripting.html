<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Davidson Gear Clothing brand</title>
  <style>
    /* Reset some default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Basic styles */
    body {
      font-family: 'Arial', sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f4f4f4;
    }

    /* Navbar styles */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #222;
      display: flex;
      justify-content: center;
      padding: 15px 0;
      z-index: 1000;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 8px 12px;
      transition: background 0.3s;
    }

    nav ul li a:hover {
      background-color: #555;
      border-radius: 4px;
    }

    /* Sections styles */
section {
  padding: 80px 20px;
  max-width: 1200px;
  margin: 0 auto;
  margin-top: 80px; /* to account for fixed navbar */
}

/* Header / Home */
#home {
  background: url('https://images.unsplash.com/photo-1612832022744-5d8a3a9b6b5f?ixlib=rb-4.0.1&auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
  height: 100vh;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

#home h1 {
  font-size: 3rem;
  margin-bottom: 20px;
  background-color: rgba(0,0,0,0.5);
  padding: 20px;
  border-radius: 10px;
}

#home p {
  font-size: 1.2rem;
  background-color: rgba(0,0,0,0.5);
  padding: 15px;
  border-radius: 10px;
}

/* Contact Us */
#contact {
  background-color: #fff;
  padding: 60px 20px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#contact h2 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 2rem;
}

form {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input, textarea {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;
}

button {
  padding: 12px;
  background-color: #222;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.3s;
}

button:hover {
  background-color: #555;
}

/* Gallery */
#gallery {
  background-color: #fff;
  padding: 60px 20px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#gallery h2 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 2rem;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

.gallery-grid img {
  width: 100%;
  height: auto;
  border-radius: 8px;
  transition: transform 0.3s;
}

.gallery-grid img:hover {
  transform: scale(1.05);
}

/* Order */
#order {
  background-color: #f4f4f4;
  padding: 60px 20px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

#order h2 {
  text-align: center;
  margin-bottom: 30px;
  font-size: 2rem;
}

.order-form {
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

#order input, #order select {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;
}

#order button {
  padding: 12px;
  background-color: #222;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.3s;
}

#order button:hover {
  background-color: #555;
}

/* Responsive adjustments */
@media(max-width: 768px){
  #home h1 {
    font-size: 2rem;
  }
  #home p {
    font-size: 1rem;
  }
}

</style>
</head>
